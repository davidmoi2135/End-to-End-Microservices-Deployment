name: GitOps Kustomize CI

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - "spring-boot-app/k8s/**"
      - "argocd/**"
      - ".github/workflows/gitops-kustomize-ci.yaml"
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - "spring-boot-app/k8s/**"
      - "argocd/**"
      - ".github/workflows/gitops-kustomize-ci.yaml"

jobs:
  render:
    name: Render ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            path: spring-boot-app/k8s/overlays/dev
          - environment: production
            path: spring-boot-app/k8s/overlays/production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Render Kustomize overlay
        run: kubectl kustomize "${{ matrix.path }}" > rendered.yaml

      - name: Check image namespace
        run: |
          if ! grep -q "hiunehihi/frontend" rendered.yaml; then
            echo "Expected frontend image namespace was not rendered"
            exit 1
          fi

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ matrix.environment }}
          path: rendered.yaml
