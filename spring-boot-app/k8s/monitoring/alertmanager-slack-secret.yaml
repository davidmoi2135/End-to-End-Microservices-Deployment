apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack-secret
  namespace: monitoring
type: Opaque
stringData:
  # Replace with your actual Slack webhook URL from:
  # Slack App > Incoming Webhooks > Add New Webhook to Workspace
  # IMPORTANT: Store the real URL in GitHub Secrets or Sealed Secrets in production
  slack-webhook-url: "https://hooks.slack.com/services/YOUR_ORG/WEBHOOK/PLACEHOLDER"
