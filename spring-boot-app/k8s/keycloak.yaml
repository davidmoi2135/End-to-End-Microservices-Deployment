apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-postgres-pvc
  namespace: spring-microservices
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres
  namespace: spring-microservices
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ports:
    - port: 5432
  selector:
    app: keycloak-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-postgres
  namespace: spring-microservices
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    matchLabels:
      app: keycloak-postgres
  template:
    metadata:
      labels:
        app: keycloak-postgres
    spec:
      containers:
        - name: keycloak-postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              value: keycloak
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: keycloak-db-password
          ports:
            - containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: keycloak-postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: data
      volumes:
        - name: keycloak-postgres-data
          persistentVolumeClaim:
            claimName: keycloak-postgres-pvc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  namespace: spring-microservices
data:
  realm-export.json: |
    {
        "realm": "spring-boot-ms-realm",
        "enabled": true,
        "sslRequired": "external",
        "registrationAllowed": true,
        "loginWithEmailAllowed": true,
        "resetPasswordAllowed": true,
        "accessTokenLifespan": 1800,
        "ssoSessionIdleTimeout": 1800,
        "ssoSessionMaxLifespan": 36000,
        "defaultRoles": ["USER", "offline_access", "uma_authorization"],
        "roles": {
            "realm": [
                { "name": "ADMIN", "description": "Administrator with full access" },
                { "name": "USER", "description": "Standard customer" }
            ]
        },
        "clients": [
            {
                "clientId": "spring-cloud-client",
                "enabled": true,
                "publicClient": true,
                "directAccessGrantsEnabled": true,
                "standardFlowEnabled": true,
                "redirectUris": ["*"],
                "webOrigins": ["+"],
                "protocol": "openid-connect",
                "fullScopeAllowed": true,
                "attributes": { "post.logout.redirect.uris": "+" }
            },
            {
                "clientId": "spring-boot-microservices",
                "enabled": true,
                "bearerOnly": true,
                "protocol": "openid-connect"
            },
            {
                "clientId": "frontend-client",
                "enabled": true,
                "publicClient": true,
                "directAccessGrantsEnabled": true,
                "redirectUris": ["*"],
                "webOrigins": ["*"],
                "protocol": "openid-connect"
            }
        ],
        "users": [
            {
                "username": "admin",
                "enabled": true,
                "email": "admin@example.com",
                "firstName": "Admin",
                "lastName": "User",
                "emailVerified": true,
                "credentials": [
                    { "type": "password", "value": "admin123", "temporary": false }
                ],
                "realmRoles": ["ADMIN", "USER"]
            },
            {
                "username": "customer",
                "enabled": true,
                "email": "customer@example.com",
                "firstName": "Customer",
                "lastName": "Demo",
                "emailVerified": true,
                "credentials": [
                    { "type": "password", "value": "customer123", "temporary": false }
                ],
                "realmRoles": ["USER"]
            }
        ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: spring-microservices
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
  selector:
    app: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: spring-microservices
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: keycloak-db-password
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: keycloak-admin-password
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import/realm-export.json
              subPath: realm-export.json
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm
