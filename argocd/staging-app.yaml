apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-microservices-staging
  namespace: argocd
  annotations:
    # === ArgoCD Image Updater ===
    # digest strategy tracks the digest of the :dev mutable tag, so the
    # tag MUST be specified inline in the image-list (allow-tags regexp does
    # not supply a tag for the digest strategy).
    argocd-image-updater.argoproj.io/image-list: >-
      product=kaing615/product-service:dev,
      cart=kaing615/cart-service:dev,
      payment=kaing615/payment-service:dev,
      discovery=kaing615/discovery-server:dev,
      gateway=kaing615/api-gateway:dev,
      order=kaing615/order-service:dev,
      inventory=kaing615/inventory-service:dev,
      notification=kaing615/notification-service:dev,
      admin=kaing615/admin-server:dev,
      frontend=kaing615/frontend:dev
    argocd-image-updater.argoproj.io/product.update-strategy: digest
    argocd-image-updater.argoproj.io/cart.update-strategy: digest
    argocd-image-updater.argoproj.io/payment.update-strategy: digest
    argocd-image-updater.argoproj.io/discovery.update-strategy: digest
    argocd-image-updater.argoproj.io/gateway.update-strategy: digest
    argocd-image-updater.argoproj.io/order.update-strategy: digest
    argocd-image-updater.argoproj.io/inventory.update-strategy: digest
    argocd-image-updater.argoproj.io/notification.update-strategy: digest
    argocd-image-updater.argoproj.io/admin.update-strategy: digest
    argocd-image-updater.argoproj.io/frontend.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/write-back-target: kustomization:.
    argocd-image-updater.argoproj.io/git-branch: dev
    # === Slack notification subscriptions ===
    notifications.argoproj.io/subscribe.on-sync-failed.slack: deployments-staging
    notifications.argoproj.io/subscribe.on-health-degraded.slack: deployments-staging
spec:
  project: default
  source:
    repoURL: https://github.com/davidmoi2135/End-to-End-Microservices-Deployment.git
    targetRevision: dev
    path: spring-boot-app/k8s-staging
  destination:
    server: https://kubernetes.default.svc
    namespace: spring-microservices-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
